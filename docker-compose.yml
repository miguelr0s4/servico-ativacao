services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ativacao
      POSTGRES_USER: ativacao
      POSTGRES_PASSWORD: ativacao
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ativacao -d ativacao"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ativacao
      SPRING_DATASOURCE_USERNAME: ativacao
      SPRING_DATASOURCE_PASSWORD: ativacao
      PROVIDER_BASE_URL: http://provider-mock:8080
      JWT_SECRET: troque-esta-chave-em-cada-ambiente-por-uma-gerada-com-32bytes
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started

  provider-mock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./provider-mock:/home/wiremock:ro
    command: ["--verbose"]

volumes:
  postgres-data:
